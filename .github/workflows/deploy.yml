name: Deploy

# Production deployment to Azure Container Apps. Runs only on pushes to the
# production branch (main). Order is strictly gated by job `needs`:
#   validate -> build-and-push -> migrate -> deploy
# so images are published and the database is migrated BEFORE any new app
# revision is activated. Migrations never run on container boot.
on:
  push:
    branches: [main]

  workflow_dispatch:

# Never run two production deploys concurrently; do not cancel an in-flight
# deploy (a half-applied rollout is worse than a queued one).
concurrency:
  group: deploy-production
  cancel-in-progress: false

# OIDC: request a federated token for azure/login; no long-lived Azure secret.
permissions:
  id-token: write
  contents: read

jobs:
  # 1) Full CI validation — the SAME workflow that gates PRs, reused verbatim.
  validate:
    uses: ./.github/workflows/ci.yml

  # 2) Build the three production images and push them to ACR, tagged
  #    immutably with the commit SHA (never `latest` as the production
  #    identifier). Built with the Docker CLI on the runner and pushed
  #    directly, NOT `az acr build` (ACR Tasks) — ACR Tasks requests are not
  #    permitted on this registry's current subscription tier
  #    (TasksOperationsNotAllowed: "ACR Tasks requests for the registry ...
  #    are not permitted"), so there is no server-side build fallback here.
  build-and-push:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # Docker-login to ACR via the Azure CLI session azure/login just
      # established (AAD token exchange — no admin username/password).
      # Requires the deploy identity to hold a data-plane ACR role (AcrPush
      # or equivalent) in addition to any management-plane role it already
      # has — see the accompanying report for what to verify/add.
      - name: ACR login (Docker)
        run: az acr login --name ${{ vars.ACR_NAME }}

      # Built locally on the runner (not server-side in ACR — see job
      # comment above). Each Dockerfile needs the whole monorepo as build
      # context (turbo prune runs inside the build), so the context is the
      # repo root (`.`).
      - name: Build API image
        run: >-
          docker build
          -f apps/api/Dockerfile
          -t ${{ vars.ACR_NAME }}.azurecr.io/sph-api:${{ github.sha }}
          .

      - name: Push API image
        run: docker push ${{ vars.ACR_NAME }}.azurecr.io/sph-api:${{ github.sha }}

      - name: Build Worker image
        run: >-
          docker build
          -f apps/worker/Dockerfile
          -t ${{ vars.ACR_NAME }}.azurecr.io/sph-worker:${{ github.sha }}
          .

      - name: Push Worker image
        run: docker push ${{ vars.ACR_NAME }}.azurecr.io/sph-worker:${{ github.sha }}

      # NEXT_PUBLIC_* are inlined at BUILD time (see apps/web/Dockerfile) — they
      # come from non-secret repository variables and are passed as build args.
      # Changing them later requires a rebuild, not a runtime env change.
      - name: Build Web image
        run: >-
          docker build
          -f apps/web/Dockerfile
          -t ${{ vars.ACR_NAME }}.azurecr.io/sph-web:${{ github.sha }}
          --build-arg NEXT_PUBLIC_API_BASE_URL=${{ vars.NEXT_PUBLIC_API_BASE_URL }}
          --build-arg NEXT_PUBLIC_ENTRA_CLIENT_ID=${{ vars.NEXT_PUBLIC_ENTRA_CLIENT_ID }}
          --build-arg NEXT_PUBLIC_REDIRECT_URI=${{ vars.NEXT_PUBLIC_REDIRECT_URI }}
          --build-arg NEXT_PUBLIC_ADMIN_CONSENT_REDIRECT_URI=${{ vars.NEXT_PUBLIC_ADMIN_CONSENT_REDIRECT_URI }}
          .

      - name: Push Web image
        run: docker push ${{ vars.ACR_NAME }}.azurecr.io/sph-web:${{ github.sha }}

  # 3) Apply Prisma migrations exactly once, from the runner, directly against
  #    the production Neon database (internet-reachable over TLS — no temporary
  #    Container Apps Job required). Forward-only; must succeed before rollout.
  #    Immediately followed by the entitlement backfill (idempotent, same
  #    DATABASE_URL) — a migration only ever creates the OrganizationEntitlement
  #    TABLE; this is what guarantees every pre-existing organization actually
  #    has a ROW, closing the exact gap that caused the "Document usage
  #    unavailable" production incident (a migrate-only pipeline with no
  #    automated backfill step). Both steps must succeed or this job fails,
  #    which blocks `deploy` (`needs: migrate`) — a deploy must never look
  #    successful while required baseline entitlement data silently failed to
  #    initialize.
  migrate:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Generate Prisma client
        run: pnpm db:generate
      - name: Apply database migrations (prisma migrate deploy)
        # DATABASE_URL is the ONE production secret GitHub needs, and only the
        # migration mechanism uses it. Never echoed; masked by Actions.
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: pnpm --filter @sph/database run migrate:deploy

      # apps/api/src/scripts/backfill-organization-entitlements.ts imports
      # backfillOrganizationEntitlements from @sph/database, which this job
      # only ever generated the Prisma client for (above) — the package's own
      # compiled dist/ (its package.json "main") doesn't exist yet on this
      # fresh runner, unlike build-and-push's Docker builds which compile it
      # inside the image. Build it directly, matching how migrate:deploy
      # itself is invoked (a plain --filter call, no turbo needed here).
      - name: Build @sph/database (required to import the backfill script)
        run: pnpm --filter @sph/database run build

      # THE SAME existing, already-tested backfill implementation
      # (packages/database/src/entitlement-backfill.ts) — no second
      # implementation. Only ever creates a row for an organization with
      # entitlement: null; never updates an existing row (see that file's own
      # idempotency test). A no-op "No organizations needed backfilling" once
      # every organization has a row, so this is safe to run unconditionally
      # on every deploy rather than a one-off manual step someone has to
      # remember to run.
      - name: Backfill missing OrganizationEntitlement rows (idempotent)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: pnpm --filter @sph/api run backfill:entitlements

  # 4) Roll out the new image to each Container App as a NEW REVISION. Runtime
  #    secrets (DATABASE_URL/REDIS_URL/ENTRA_CLIENT_SECRET) are configured ONCE
  #    at app-create time as Container Apps secrets sourced from Key Vault and
  #    are NOT touched here — the pipeline only changes the image (+ the
  #    non-secret WEB_APP_ORIGIN on the API). The previous revision is retained
  #    for rollback.
  deploy:
    needs: migrate
    runs-on: ubuntu-latest
    steps:
      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy API
        run: >-
          az containerapp update
          --name ${{ vars.ACA_API_APP }}
          --resource-group ${{ vars.AZURE_RESOURCE_GROUP }}
          --image ${{ vars.ACR_NAME }}.azurecr.io/sph-api:${{ github.sha }}
          --set-env-vars WEB_APP_ORIGIN=${{ vars.WEB_APP_ORIGIN }} NODE_ENV=production

      - name: Deploy Worker
        run: >-
          az containerapp update
          --name ${{ vars.ACA_WORKER_APP }}
          --resource-group ${{ vars.AZURE_RESOURCE_GROUP }}
          --image ${{ vars.ACR_NAME }}.azurecr.io/sph-worker:${{ github.sha }}

      - name: Deploy Web
        run: >-
          az containerapp update
          --name ${{ vars.ACA_WEB_APP }}
          --resource-group ${{ vars.AZURE_RESOURCE_GROUP }}
          --image ${{ vars.ACR_NAME }}.azurecr.io/sph-web:${{ github.sha }}
