name: CI

on:
  pull_request:
  # Reusable: the Deploy workflow (deploy.yml) calls this on pushes to main so
  # the exact same validation gates production — no duplicated command set, and
  # no double-run (the standalone push:main trigger is intentionally removed).
  workflow_call:

jobs:
  ci:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: sharepoint_knowledge_health
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/sharepoint_knowledge_health?schema=public
      REDIS_URL: redis://localhost:6379
      NODE_ENV: test
      # `@sph/web#typecheck` dependsOn the web's own `build` (turbo.json), so
      # `pnpm typecheck`/`pnpm test` here transitively run `next build`, which
      # statically prerenders pages and evaluates NEXT_PUBLIC_* (msal-config /
      # api/client throw if unset). The CI runner has no apps/web/.env.local
      # (gitignored), so provide these for the validation build. Values are
      # build-time-only and never deployed — the production web IMAGE is built
      # separately in deploy.yml with the real repository variables. Use the
      # real vars when present, else harmless placeholders so validation never
      # breaks on an unset variable (e.g. fork PRs).
      NEXT_PUBLIC_API_BASE_URL: ${{ vars.NEXT_PUBLIC_API_BASE_URL || 'http://localhost:3001' }}
      NEXT_PUBLIC_ENTRA_CLIENT_ID: ${{ vars.NEXT_PUBLIC_ENTRA_CLIENT_ID || 'ci-build-placeholder-client-id' }}
      NEXT_PUBLIC_REDIRECT_URI: ${{ vars.NEXT_PUBLIC_REDIRECT_URI || 'http://localhost:3000' }}
      NEXT_PUBLIC_ADMIN_CONSENT_REDIRECT_URI: ${{ vars.NEXT_PUBLIC_ADMIN_CONSENT_REDIRECT_URI || 'http://localhost:3000/connect/admin-consent-callback' }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm db:generate

      - name: Apply database migrations
        run: pnpm --filter @sph/database run migrate:deploy

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test
